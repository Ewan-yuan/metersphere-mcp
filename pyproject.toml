[project]
name = "metersphere-mcp"
version = "0.1.0"
description = "MeterSphere MCP server: 功能用例 CRUD、测试计划创建/查询、计划关联用例"
requires-python = ">=3.10"
dependencies = [
    # mcp: 官方 MCP SDK，标准库/仓库内无既有 MCP 实现
    "mcp>=1.2.0",
    # httpx: HTTP 客户端（支持 multipart part 级 Content-Type）
    "httpx>=0.27",
    # cryptography: AK/SK 签名需要 AES-128-CBC/PKCS7，标准库无对称加密
    "cryptography>=42.0",
]

[project.scripts]
metersphere-mcp = "metersphere_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metersphere_mcp"]

[dependency-groups]
dev = ["pytest>=8.0"]
